# ==================== 1. 资源与数据库 ====================
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
geo-auto-update: true
geo-update-interval: 24
# ==================== 2. 预处理锚点 ====================
Anchor_Ex_Waste: &Ex_Waste '(?i)(断线|删除|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置|联系|群|邀请|返利|循环|获取|到期|机场|下次|版本|备用|已用|工单|贩卖|通知|倒卖|防止|地址|频道|无法|提示|特别|访问|支持|教程|关注|更新|作者|加入|卸载|可解决|只看|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|traffic|([3-9]\d*(\.\d+)?|2\.[1-9]\d*)\s*[xX✕✖⨉倍率]|[xX✕✖⨉倍率]\s*([3-9]\d*(\.\d+)?|2\.[1-9]\d*))'
Anchor_Ex_Other: &Ex_Other '(?i)(DIY|自建|VPS|MyNode|Self|NAT|香港|HongKong|\bHK\b|新加坡|Singapore|\bSG\b|日本|Japan|\bJP\b|台湾|Taiwan|\bTW\b|美国|USA|\bUS\b)'
Anchor_F_DIY: &F_DIY '(?i)(DIY|自建|VPS|MyNode|Self|NAT)'
Anchor_F_HK: &F_HK '(?i)(香港|Hong\s*Kong|HongKong|\bHK\b)'
Anchor_F_SG: &F_SG '(?i)(新加坡|狮城|獅城|Singapore|\bSG\b)'
Anchor_F_JP: &F_JP '(?i)(日本|Japan|\bJP\b)'
Anchor_F_TW: &F_TW '(?i)(台湾|台灣|Taiwan|\bTW\b)'
Anchor_F_US: &F_US '(?i)(美国|美國|United\s*States|UnitedStates|USA|\bUS\b)'
Anchor_F_AIGC: &F_AIGC '(?i)(美国|美國|USA|\bUS\b|台湾|台灣|Taiwan|\bTW\b|日本|Japan|\bJP\b)'
Anchor_AUTO: &AUTO {type: url-test, url: 'http://www.gstatic.com/generate_204', interval: 180, tolerance: 50, timeout: 2000, lazy: true, hidden: true, include-all: true, exclude-filter: *Ex_Waste}
Anchor_SEL: &SEL {type: select, include-all: true, exclude-filter: *Ex_Waste}
Anchor_APP: &APP {type: select, proxies: [自建节点, 香港节点, 狮城节点, 日本节点, 台湾节点, 美国节点, 其他节点, 故障转移, DIRECT]}
Anchor_Rule: &Rule {type: http, interval: 259200, proxy: 故障转移, format: mrs}
# ==================== 3. 节点订阅 ====================
proxy-providers:
  chince:
    type: http
    interval: 86400
    proxy: DIRECT
    health-check: {enable: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300}
    url: '${SUB_URL}'
# ==================== 4. 核心调度 (⚠️ 软路由 / Mac 双端切换区) ====================
mode: rule
mixed-port: 7890
# 🔽 【局域网接管开关】
allow-lan: true
ipv6: true
unified-delay: true
tcp-concurrent: true
global-ua: clash.meta
find-process-mode: strict
geodata-mode: true
# 🔽 【内存调度器开关】(极度关键，决定系统是否会崩溃)电脑手机standard#路由器memconservative
geodata-loader: memconservative
tun:
  enable: true
  stack: system
  auto-route: true
  auto-redirect: true
  dns-hijack: ['any:53', 'tcp://any:53']
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff: {QUIC: {ports: [443]}, TLS: {ports: [443, 8443]}, HTTP: {ports: [80, 8080-8880], override-destination: true}}
  skip-domain: ["+.apple.com", "+.push.apple.com", "+.wechat.com", "+.qq.com", "+.tencent.com", "+.vivox.com"]
# ==================== 5. DNS 防污染引擎 ====================
dns:
  enable: true
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  cache-algorithm: arc
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - 'geosite:cn'
    - 'geosite:private'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.pool.ntp.org'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.stun.*'
    - '+.stun.*.*'
    - '+.wechat.com'
    - '+.qq.com'
    - '+.tencent.com'
    - 'mesh.ts.net'
  default-nameserver: [119.29.29.29, 223.5.5.5]
  proxy-server-nameserver: [119.29.29.29, 223.5.5.5]
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver-policy:
    'geosite:cn,private,geolocation-cn': [211.140.11.68, 211.140.12.68, 119.29.29.29, 223.5.5.5]
# ==================== 6. 策略组矩阵 (国家地区优先，业务策略在后) ====================
proxy-groups:
  # --- 1. 基础自建与地区节点组 (置于最前) ---
  - {name: 自建节点, <<: *SEL, filter: *F_DIY, icon: https://raw.githubusercontent.com/LUCK777777/photo/main/icons8-cloudflare-96.png}
  - {name: ⚡ 香港智能, <<: *AUTO, filter: *F_HK}
  - {name: 香港节点, <<: *SEL, filter: *F_HK, proxies: [⚡ 香港智能], icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/HongKong.png}
  - {name: ⚡ 狮城智能, <<: *AUTO, filter: *F_SG}
  - {name: 狮城节点, <<: *SEL, filter: *F_SG, proxies: [⚡ 狮城智能], icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Singapore.png}
  - {name: ⚡ 日本智能, <<: *AUTO, filter: *F_JP}
  - {name: 日本节点, <<: *SEL, filter: *F_JP, proxies: [⚡ 日本智能], icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Japan.png}
  - {name: ⚡ 台湾智能, <<: *AUTO, filter: *F_TW}
  - {name: 台湾节点, <<: *SEL, filter: *F_TW, proxies: [⚡ 台湾智能], icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Taiwan.png}
  - {name: ⚡ 美国智能, <<: *AUTO, filter: *F_US}
  - {name: 美国节点, <<: *SEL, filter: *F_US, proxies: [⚡ 美国智能], icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/UnitedStates.png}
  - {name: 其他节点, <<: *SEL, exclude-filter: *Ex_Other, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/WorldMap.png}
  - {name: 故障转移, type: fallback, url: 'http://www.gstatic.com/generate_204', interval: 180, timeout: 2000, lazy: true, proxies: [⚡ 香港智能, ⚡ 狮城智能, ⚡ 日本智能, ⚡ 台湾智能, ⚡ 美国智能, DIRECT], icon: https://raw.githubusercontent.com/LUCK777777/photo/main/icons8-yu-96.png}
  - {name: 自选策略, type: select, proxies: [自建节点, 香港节点, 狮城节点, 日本节点, 台湾节点, 美国节点, 其他节点, 故障转移, DIRECT], icon: https://raw.githubusercontent.com/LUCK777777/photo/main/icons8-zy-100.png}
  - {name: AIGC, <<: *SEL, filter: *F_AIGC, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/ChatGPT.png}
  - {name: GitHub, <<: *APP, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/GitHub.png}
  - {name: Apple, <<: *APP, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Apple.png}
  - {name: Microsoft, <<: *APP, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Microsoft.png}
  - {name: Google, <<: *APP, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Google.png}
  - {name: Telegram, <<: *APP, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Telegram.png}
